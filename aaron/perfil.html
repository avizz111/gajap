<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3" style="padding-top: 300px;">

    <main class="container bg-white shadow-sm rounded-4 p-4 text-center" style="width: 420px; height: 750px; justify-content: center;">

        <section class="position-relative d-inline-block mb-3">
            <div class="bg-verde-avatar rounded-circle d-flex align-items-center justify-content-center mx-auto" style="width: 130px; height: 130px;">
                <i class="bi bi-person-fill text-dark display-1"></i>
            </div>
            <button class="btn bg-verde-edit rounded-circle position-absolute bottom-0 end-0 p-0 border border-2 border-white d-flex align-items-center justify-content-center shadow-sm" style="width: 38px; height: 38px;" aria-label="Editar foto de perfil">
                <i class="bi bi-pencil-fill text-dark fs-6"></i>
            </button>
        </section>
        <h1 class="h4 fw-bold text-dark mb-3">Nombre de Usuario</h1>
        <section class="bg-verde-box rounded-4 p-3 text-start mb-4">
            <p class="fw-bold text-dark mb-1 small">Etiquetas de Usuario:</p>
            <span class="d-block text-secondary small">#No Azúcar</span>
            <span class="d-block text-secondary small">#No Zanahoria</span>
        </section>
        <section class="row g-3 mb-4">
            <div class="col-4">
                <a href="#" class="btn bg-verde-boton w-100 p-3 d-flex align-items-center justify-content-center mb-2">
                    <i class="bi bi-bookmark-plus-fill text-dark fs-3"></i>
                </a>
                <span class="small fw-semibold text-secondary d-block">Guardados</span>
            </div>
            <div class="col-4">
                <a href="#" class="btn bg-verde-boton w-100 p-3 d-flex align-items-center justify-content-center mb-2">
                    <i class="bi bi-hash text-dark fs-3"></i>
                </a>
                <span class="small fw-semibold text-secondary d-block">Tus Etiquetas</span>
            </div>
            <div class="col-4">
                <a href="#" class="btn bg-verde-boton w-100 p-3 d-flex align-items-center justify-content-center mb-2">
                    <i class="bi bi-clock-fill text-dark fs-3"></i>
                </a>
                <span class="small fw-semibold text-secondary d-block">Historial</span>
            </div>
        </section>
        <section class="px-2">
            <button class="btn bg-verde-btn-cierre w-100 py-2 fw-semibold shadow-sm">
                Cerrar sesión
            </button>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
